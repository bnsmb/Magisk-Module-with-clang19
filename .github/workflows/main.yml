name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - production
          - pre-release
      release_tag:
        description: 'Release tag (leave empty for auto-generate)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title'
        required: true
        type: string
        default: ''
      release_notes:
        description: 'Release notes'
        required: false
        type: string
        default: 'Auto-generated release'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
        
      - name: Extract version from module.prop
        id: module_info
        run: |
          if [ -f "module.prop" ]; then
            MODULE_ID=$(grep "^id=" module.prop | cut -f2 -d "=")
            MODULE_VERSION=$(grep "^version=" module.prop | cut -f2 -d "=")
            echo "module_id=$MODULE_ID" >> $GITHUB_OUTPUT
            echo "module_version=$MODULE_VERSION" >> $GITHUB_OUTPUT
            echo "Module: $MODULE_ID v$MODULE_VERSION"
          else
            echo "module.prop not found!"
            exit 1
          fi
        
      - name: Generate tag if not provided
        id: tag
        run: |
          if [ -z "${{ github.event.inputs.release_tag }}" ]; then
            # Auto-generate tag from module version
            TAG="v${{ steps.module_info.outputs.module_version }}"
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi
          echo "Tag: ${{ steps.tag.outputs.tag_name }}"
        
      - name: Make script executable
        run: chmod +x create_zip.sh
        
      - name: Source and run create_zip.sh
        id: create_zip
        run: |
          # Source the script to execute it in the current shell
          source ./create_zip.sh >/dev/null
          
          # Get the filename of the created zip
          ZIP_FILE="${ZIPFILE}"

          echo "The ZIP file is: \"${ZIP_FILE}\" "
          
          if [ ! -r "$ZIP_FILE" ]; then
            echo "No ZIP file created!"
            exit 1
          fi
          
          # Get file size
          FILE_SIZE=$(du -h "$ZIP_FILE" | cut -f1)
          
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "zip_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "Created ZIP: $ZIP_FILE ($FILE_SIZE)"
          
      - name: Generate release body
        id: release_body
        run: |
          RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
          
          cat > release_body.md << EOF
          ## ${{ github.event.inputs.release_title }}
          
          **Module:** ${{ steps.module_info.outputs.module_id }}  
          **Version:** ${{ steps.module_info.outputs.module_version }}  
          **Release Type:** ${{ github.event.inputs.release_type }}  
          **File:** ${{ steps.create_zip.outputs.zip_file }} (${{ steps.create_zip.outputs.zip_size }})
          
          ### 📦 Included in this release
          - ZIP file: ${{ steps.create_zip.outputs.zip_file }}
          
          ### 📝 Release Notes
          $RELEASE_NOTES
          
          ---
          *Auto-generated by GitHub Actions*
          EOF
          
          echo "release_body_file=release_body.md" >> $GITHUB_OUTPUT
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          body_path: ${{ steps.release_body.outputs.release_body_file }}
          files: ${{ steps.create_zip.outputs.zip_file }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifact (optional backup)
        uses: actions/upload-artifact@v4
        if: github.event.inputs.release_type == 'pre-release'
        with:
          name: ${{ steps.create_zip.outputs.zip_file }}
          path: ${{ steps.create_zip.outputs.zip_file }}
          retention-days: 30
          
      - name: Summary
        run: |
          echo "## ✅ Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Type:** ${{ github.event.inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** ${{ github.event.inputs.release_title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Module:** ${{ steps.module_info.outputs.module_id }} v${{ steps.module_info.outputs.module_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** ${{ steps.create_zip.outputs.zip_file }} (${{ steps.create_zip.outputs.zip_size }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Released successfully" >> $GITHUB_STEP_SUMMARY
